name: Canon/Lore Issue
description: "Report a consistency mistake with the setting's lore or canon."
title: "[Canon Error]: "
labels: [canon]
body:
  - type: textarea
    attributes:
      label: Lore Precedent
      description: Provide evidence of a precedent for the lore set by prior articles.
      placeholder: "Article `a` and `b` say that 2 + 2 equals 4."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Problematic Article(s)
      description: A list of articles which go against the precedent and how they do so.
      placeholder: "Article `c` and `d` say that 2 + 2 equals 5."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Suggested Fix
      description: How should the text be changed or corrected?
      placeholder: "Change articles `c` and `d` to say that 2 + 2 equals 4."
    validations:
      required: false
