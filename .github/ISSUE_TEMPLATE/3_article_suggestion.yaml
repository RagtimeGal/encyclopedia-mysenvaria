name: Article Suggestion
description: "Make a suggestion to improve an article."
title: "[Suggestion]: "
labels: [suggestion]
body:
  - type: input
    attributes:
      label: Article Title & Path
      description: What article are you making a suggestion for?
      placeholder: "Example: 'content/Encyclopedia Mysenvaria/Geography/Natural Features/Your Mother'"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Suggestion
      description: What in the article could use improving, why?
      placeholder: "The article mentions that Your Mother is large, but has no mention of her actual size. It should clearly state her girth."
    validations:
      required: true
